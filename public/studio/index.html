<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WTF Studio</title>
<!-- WTF Studio v0: perform a story line by line. Made 2026-11-20 by Claude Opus 5.5 for Mike Wolf (@WTF). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
:root{--bg:#0d1d37;--deep:#081428;--panel:#13284a;--line:#22406e;--fg:#f5f0e6;--muted:#9fb3cf;--ai:#22c3df;--wtf:#f5a524;--red:#ff5a5a;--green:#3ddc97;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--deep);flex-wrap:wrap}
.brand{font-weight:900;font-size:22px}.brand .a{color:var(--ai)}.brand .w{color:var(--wtf)}.brand small{color:var(--muted);font-size:12px;letter-spacing:.2em;margin-left:6px}
.meta{color:var(--muted);font-size:14px;font-weight:700}.grow{flex:1}
.prog{height:8px;width:220px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);width:0}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;padding:20px;min-height:0}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.vis{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.vis img{width:100%;height:100%;object-fit:cover;display:block}
.beats{display:flex;gap:6px;flex-wrap:wrap}
.beats button{background:var(--panel);border:2px solid transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
.beats button.on{border-color:var(--wtf);color:var(--fg)}.beats button.done{color:var(--green)}
.script{display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto}
.ln{background:var(--panel);border-radius:12px;padding:16px 18px;border:3px solid transparent;cursor:pointer}
.ln.cur{border-color:var(--wtf)}.ln.ai.cur{border-color:var(--ai)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.who .badge{padding:3px 10px;border-radius:999px;background:var(--line);color:var(--fg)}
.ln.ai .badge{background:var(--ai);color:#04202a}
.txt{font-size:clamp(20px,2.2vw,30px);font-weight:700;line-height:1.35}
.ln:not(.cur) .txt{font-size:18px;color:var(--muted)}
.hint{font-size:14px;color:var(--ai);margin-top:8px}
.takes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.takes button{font:inherit;font-size:12px;font-weight:700;background:var(--line);color:var(--fg);border:2px solid transparent;border-radius:6px;padding:4px 8px;cursor:pointer}
.takes button.pick{border-color:var(--green)}
.bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--deep);flex-wrap:wrap}
.rec{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:999px;padding:14px 28px;background:var(--red);color:#fff;cursor:pointer;min-width:220px}
.rec.on{background:#fff;color:var(--red)}
.btn{font:inherit;font-weight:700;background:var(--panel);color:var(--fg);border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.btn:focus-visible,.rec:focus-visible,.ln:focus-visible{outline:3px solid var(--wtf)}
.lvl{width:120px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}.lvl i{display:block;height:100%;width:0;background:var(--green)}
.status{color:var(--muted);font-size:14px}
.keys{color:var(--muted);font-size:12px}
.gate{max-width:560px;margin:10vh auto;padding:28px;background:var(--panel);border-radius:14px;line-height:1.5}
.gate input{width:100%;font:inherit;padding:10px;border-radius:8px;border:0;margin:8px 0}
</style></head><body>
<header>
  <div class="brand"><span class="a">AI</span> <span class="w">WTF</span><small>STUDIO</small></div>
  <div class="meta" id="meta"></div><div class="grow"></div>
  <div class="meta" id="count"></div><div class="prog"><i id="progbar"></i></div>
</header>
<main id="main" hidden>
  <section class="stage">
    <div class="vis"><img id="vis" alt=""></div>
    <div class="beats" id="beats"></div>
  </section>
  <section class="script" id="script"></section>
</main>
<div class="bar" id="bar" hidden>
  <button class="rec" id="rec">● Record line</button>
  <button class="btn" id="play">▶ Play take</button>
  <button class="btn" id="prev">← Line</button><button class="btn" id="next">Line →</button>
  <div class="lvl"><i id="lvl"></i></div>
  <div class="status" id="status">Ready.</div><div class="grow"></div>
  <div class="keys">Space record/stop · P play · ← → move</div>
</div>
<div class="gate" id="gate" hidden></div>
<script>
const q=new URLSearchParams(location.search);const STORY_ID=(q.get('story')||'').replace(/[^0-9A-Za-z._-]/g,'');let CODE=q.get('code')||'';
const API=(extra='')=>`/.netlify/functions/studio-takes?story=${encodeURIComponent(STORY_ID)}&code=${encodeURIComponent(CODE)}${extra}`;
const $=id=>document.getElementById(id);let S=null,LINES=[],cur=0,takes={},chosen={},rec=null,stream=null,chunks=[],an=null;
function gate(msg){$('gate').hidden=false;$('gate').innerHTML=msg;}
async function boot(){
  if(!STORY_ID)return gate('<h2>WTF Studio</h2><p>Open this page with a story, for example <b>?story=2026-11-18</b>.</p>');
  if(!CODE){CODE=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
    history.replaceState(null,'',`?story=${STORY_ID}&code=${CODE}`);}
  try{S=await (await fetch(`stories/${STORY_ID}/story.json`)).json();}catch(e){return gate(`<h2>No story called ${STORY_ID}</h2><p>The AI hasn't drafted it yet.</p>`);}
  S.beats.forEach(b=>b.lines.forEach((l,i)=>LINES.push({b,i,l,key:`${b.id}-${i}`,ai:S.cast[l.who].kind==='ai',name:S.cast[l.who].name})));
  $('meta').textContent=`${new Date(S.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} · ${S.question}`;
  $('beats').innerHTML=S.beats.map(b=>`<button data-b="${b.id}">${b.chapter||b.id}</button>`).join('');
  $('beats').onclick=e=>{const id=e.target.dataset.b;if(id)go(LINES.findIndex(x=>x.b.id===id));};
  $('main').hidden=false;$('bar').hidden=false;await refresh();go(firstUnrecorded());
}
async function refresh(){try{const r=await fetch(API());const d=await r.json();if(!r.ok)throw new Error(d.error);takes={};
  for(const k of d.takes){const[line,t]=k.split('/');(takes[line]=takes[line]||[]).push(+t);}for(const l in takes)takes[l].sort((a,b)=>a-b);chosen=d.chosen||{};}
  catch(e){status('Could not load saved takes: '+e.message);}render();}
const firstUnrecorded=()=>{const i=LINES.findIndex(x=>!takes[x.key]);return i<0?0:i;};
function status(t){$('status').textContent=t;}
function go(i){if(rec)return;cur=Math.max(0,Math.min(LINES.length-1,i));render();}
function render(){const L=LINES[cur];if(!L)return;const b=L.b;
  $('vis').src=`stories/${STORY_ID}/beats/${b.id}.jpg`;
  document.querySelectorAll('#beats button').forEach(x=>{x.classList.toggle('on',x.dataset.b===b.id);x.classList.toggle('done',LINES.filter(y=>y.b.id===x.dataset.b).every(y=>takes[y.key]));});
  $('script').innerHTML=LINES.filter(x=>x.b===b).map(x=>{const n=LINES.indexOf(x),t=takes[x.key]||[];const pick=chosen[x.key]??t.at(-1);
    return `<div class="ln ${x.ai?'ai':''} ${n===cur?'cur':''}" tabindex="0" data-n="${n}"><div class="who"><span class="badge">${x.ai?'MIC → '+x.name.toUpperCase():'YOU'}</span>${n===cur?'NOW':''}</div>
    <div class="txt">${x.l.text.replace(/</g,'&lt;')}</div>${x.ai&&n===cur?`<div class="hint">Read this as ${x.name}. Your reading becomes ${x.name}'s voice; your pace and intonation stay.</div>`:''}
    <div class="takes">${t.map(k=>`<button data-line="${x.key}" data-take="${k}" class="${k===pick?'pick':''}">Take ${k}${k===pick?' ✓':''}</button>`).join('')}</div></div>`;}).join('');
  const done=LINES.filter(x=>takes[x.key]).length;$('count').textContent=`${done} of ${LINES.length} lines`;$('progbar').style.width=(100*done/LINES.length)+'%';
  $('rec').textContent=rec?'■ Stop and keep':(takes[L.key]?'● Retake line':'● Record line');$('rec').classList.toggle('on',!!rec);}
$('script').onclick=async e=>{const t=e.target.closest('.takes button');if(t){chosen[t.dataset.line]=+t.dataset.take;render();playTake(t.dataset.line,+t.dataset.take);
    await fetch(API(),{method:'PUT',body:JSON.stringify(chosen)}).catch(()=>{});return;}const ln=e.target.closest('.ln');if(ln)go(+ln.dataset.n);};
async function mic(){if(stream)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
  const ctx=new AudioContext(),src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);const buf=new Float32Array(1024);
  (function meter(){an.getFloatTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v));$('lvl').style.width=Math.min(100,m*140)+'%';$('lvl').style.background=m>0.95?'var(--red)':'var(--green)';requestAnimationFrame(meter);})();return stream;}
async function toggle(){if(rec){rec.stop();return;}
  try{await mic();}catch(e){return status('The microphone is blocked. Allow it for this page and try again.');}
  const L=LINES[cur];chunks=[];const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';
  rec=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:128000}:{});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=async()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;render();
    const n=((takes[L.key]||[]).at(-1)||0)+1;status(`Saving take ${n}…`);
    try{const r=await fetch(API(`&line=${L.key}&take=${n}`),{method:'POST',headers:{'content-type':blob.type},body:blob});const d=await r.json();if(!r.ok)throw new Error(d.error);
      (takes[L.key]=takes[L.key]||[]).push(n);delete chosen[L.key];status(`Saved take ${n} of "${L.l.text.slice(0,30)}…"`);if(cur<LINES.length-1)go(cur+1);else{render();status('Every line has a take. The AI review comes next.');}}
    catch(e){status('Not saved: '+e.message+'. Record it again.');render();}};
  rec.start();status(L.ai?`Recording, read it as ${L.name}…`:'Recording…');render();}
let audio=null;async function playTake(line,take){audio?.pause();const r=await fetch(API(`&key=${line}/${take}`));if(!r.ok)return status('That take is not available.');
  audio=new Audio(URL.createObjectURL(await r.blob()));audio.play();}
$('rec').onclick=toggle;$('play').onclick=()=>{const L=LINES[cur],t=takes[L.key];if(t)playTake(L.key,chosen[L.key]??t.at(-1));else status('No take yet for this line.');};
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='p')$('play').click();});
boot();
</script></body></html>
